name: 功能建议
description: 提出具体使用场景或改进建议
body:
  - type: input
    id: affected-skill
    attributes:
      label: 涉及技能或资料
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前困难
      description: 请提供脱敏背景，说明要完成什么。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法、替代方案或限制
