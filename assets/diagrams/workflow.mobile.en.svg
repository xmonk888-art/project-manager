<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1150" viewBox="0 0 720 1150" role="img" aria-labelledby="title"><title id="title">From request to reviewed work</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#B3C3D8"/></marker></defs><rect width="720" height="1150" rx="28" fill="#F3F6FC"/><text x="44" y="61" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#315DEB" text-anchor="start">XUALAB / PROJECT-MANAGER</text><text x="44" y="115" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="31" font-weight="700" fill="#14283F" text-anchor="start">From request to reviewed work</text><rect x="38" y="157" width="644" height="143" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><circle cx="91" cy="210" r="26" fill="#315DEB"/><text x="91" y="219" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">1</text><text x="140" y="213" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#14283F" text-anchor="start">Recover context</text><text x="140" y="262" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="400" fill="#53677F" text-anchor="start">Goal, stage, current sources</text><path d="M360,306 L360,328" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="334" width="644" height="143" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><circle cx="91" cy="387" r="26" fill="#315DEB"/><text x="91" y="396" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">2</text><text x="140" y="390" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#14283F" text-anchor="start">Check capabilities</text><text x="140" y="439" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="400" fill="#53677F" text-anchor="start">Available skills and gaps</text><path d="M360,483 L360,505" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="511" width="644" height="143" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><circle cx="91" cy="564" r="26" fill="#315DEB"/><text x="91" y="573" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">3</text><text x="140" y="567" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#14283F" text-anchor="start">Assign work</text><text x="140" y="616" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="400" fill="#53677F" text-anchor="start">Roles, inputs and ownership</text><path d="M360,660 L360,682" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="688" width="644" height="143" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><circle cx="91" cy="741" r="26" fill="#315DEB"/><text x="91" y="750" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">4</text><text x="140" y="744" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#14283F" text-anchor="start">Execute &amp; review</text><text x="140" y="793" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="400" fill="#53677F" text-anchor="start">Outputs, evidence, rechecks</text><path d="M360,837 L360,859" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="865" width="644" height="143" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><circle cx="91" cy="918" r="26" fill="#087C75"/><text x="91" y="927" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">5</text><text x="140" y="921" font-family="'Microsoft YaHei','Segoe UI