<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title"><title id="title">让任务沿着清晰的流程推进</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#B3C3D8"/></marker></defs><rect width="1600" height="430" rx="28" fill="#F3F6FC"/><text x="42" y="55" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#315DEB" text-anchor="start">XUALAB / PROJECT-MANAGER</text><text x="42" y="109" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#14283F" text-anchor="start">让任务沿着清晰的流程推进</text><rect x="42" y="155" width="280" height="187" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><text x="64" y="202" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#315DEB" text-anchor="start">01</text><text x="64" y="255" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#14283F" text-anchor="start">恢复项目</text><text x="64" y="301" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#53677F" text-anchor="start">目标、阶段、权威版本</text><path d="M327,249 L346,249" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="351" y="155" width="280" height="187" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><text x="373" y="202" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#315DEB" text-anchor="start">02</text><text x="373" y="255" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#14283F" text-anchor="start">核对能力</text><text x="373" y="301" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#53677F" text-anchor="start">已有技能、工具与缺口</text><path d="M636,249 L655,249" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="660" y="155" width="280" height="187" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><text x="682" y="202" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#315DEB" text-anchor="start">03</text><text x="682" y="255" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#14283F" text-anchor="start">按需分工</text><text x="682" y="301" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#53677F" text-anchor="start">明确职责、依赖与负责人</text><path d="M945,249 L964,249" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="969" y="155" width="280" height="187" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><text x="991" y="202" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#315DEB" text-anchor="start">04</text><text x="991" y="255" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#14283F" text-anchor="start">执行与验收</text><text x="991" y="301" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#53677F" text-anchor="start">实际成果、证据与回查</text><path d="M1254,249 L1273,249" stroke="#B3C3D8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1278" y="155" width="280" height="187" rx="20" fill="#FFFFFF" stroke="#DDE5EE"/><text x="1300" y="202" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#087C75" text-anchor="start">05</text><text x="1300" y="255" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#14283F" text-anchor="start">汇报与交接</text><text x="1300" y="301" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#53677F" text-anchor="start">交付位置、结论与下一步</text><text x="42" y="394" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="22" font-weight="400" fill="#53677F" text-anchor="start">复杂任务按需委派；简单任务直接处理。</text></svg>
