<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img"><title>Evidence from a synthetic project trial</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="1438" height="648" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="105" font-size="46" font-weight="700" fill="#18392F" text-anchor="start">From an incomplete prototype to a working package.</text><text x="40" y="150" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">v1.3.0 · 2026-11-17 · Local Windows / Python</text><rect x="40" y="220" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="64" y="288" font-size="56" font-weight="700" fill="#8A552A" text-anchor="start">7 + 1</text><text x="64" y="350" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">Baseline: 7 failures, 1 error</text><rect x="500" y="220" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="524" y="288" font-size="56" font-weight="700" fill="#176855" text-anchor="start">8 / 8</text><text x="524" y="350" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">After repair: all checks pass</text><rect x="960" y="220" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="984" y="288" font-size="56" font-weight="700" fill="#176855" text-anchor="start">21</text><text x="984" y="350" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">Extra rows checked independently</text><text x="40" y="440" font-size="23" font-weight="600" fill="#18392F" text-anchor="start">Before approval: 7 original files unchanged. After approval: code, reports, guide and ZIP delivered.</text><text x="40" y="484" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">The coordinator repaired failures and continued after a progress query.</text><rect x="40" y="550" width="1360" height="78" rx="12" fill="#E8F3ED" stroke="#C9DDD2"/><text x="60" y="581" font-size="23" font-weight="600" fill="#176855" text-anchor="start">Synthetic trial · Approval simulated by the evaluator</text><text x="60" y="613" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">No baseline comparison or long-running guarantee.</text></g></svg>