<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img"><title>Project manager: goal-led workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="1438" height="538" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="105" font-size="46" font-weight="700" fill="#18392F" text-anchor="start">One agreed goal. Work through to delivery.</text><text x="40" y="150" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">Recover progress. Agree the goal. Execute, repair and verify.</text><rect x="40" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="58" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">01</text><text x="58" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Recover progress</text><text x="58" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">Check records and</text><text x="58" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">outputs</text><path d="M252 298H267" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="270" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="288" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">02</text><text x="288" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Agree the goal</text><text x="288" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">Set outputs and</text><text x="288" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">criteria</text><path d="M482 298H497" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="500" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="518" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">03</text><text x="518" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Connect stages</text><text x="518" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">Link work to the</text><text x="518" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">goal</text><path d="M712 298H727" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="730" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="748" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">04</text><text x="748" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Execute and check</text><text x="748" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">Coordinate and</text><text x="748" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">review</text><path d="M942 298H957" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="960" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="978" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">05</text><text x="978" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Repair and verify</text><text x="978" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">Fix failed</text><text x="978" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">requirements</text><rect x="1190" y="220" width="210" height="156" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="1208" y="254" font-size="22" font-weight="700" fill="#176855" text-anchor="start">06</text><text x="1208" y="298" font-size="22" font-weight="650" fill="#18392F" text-anchor="start">Deliver the result</text><text x="1208" y="328" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">All required checks</text><text x="1208" y="358" font-size="21" font-weight="400" fill="#526C65" text-anchor="start">pass</text><path d="M835 218V184H1295V218" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><text x="1065" y="176" font-size="20" font-weight="600" fill="#176855" text-anchor="middle">All required checks pass</text><path d="M1065 380V420H835V381" fill="none" stroke="#176855" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="952" y="455" font-size="23" font-weight="600" fill="#176855" text-anchor="middle">Return to verification after repair.</text><text x="40" y="500" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">User approval starts execution. Stage completion is not project completion. Record genuine blockers.</text></g></svg>