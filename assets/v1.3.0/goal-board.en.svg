<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img"><title>Goals, stages and current work</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="1438" height="718" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="105" font-size="46" font-weight="700" fill="#18392F" text-anchor="start">Keep the goal visible at every stage.</text><text x="40" y="150" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">Recover actual progress, then choose the next required task.</text><rect x="40" y="205" width="470" height="118" rx="14" fill="#176855" stroke="#176855"/><text x="64" y="248" font-size="30" font-weight="650" fill="#FFFFFF" text-anchor="start">Final goal</text><text x="64" y="282" font-size="23" font-weight="400" fill="#E5F2EB" text-anchor="start">Deliverables and acceptance</text><text x="64" y="311" font-size="22" font-weight="400" fill="#E5F2EB" text-anchor="start">Goal version · Approval evidence</text><path d="M275.0 326V347" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="350" width="470" height="118" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="64" y="393" font-size="30" font-weight="650" fill="#18392F" text-anchor="start">Stage objective</text><text x="64" y="434" font-size="25" font-weight="400" fill="#526C65" text-anchor="start">What is still required?</text><path d="M275.0 471V492" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="495" width="470" height="118" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="64" y="538" font-size="30" font-weight="650" fill="#18392F" text-anchor="start">Current task</text><text x="64" y="579" font-size="25" font-weight="400" fill="#526C65" text-anchor="start">Which check does this serve?</text><text x="550" y="190" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">Progress needs evidence</text><rect x="550" y="205" width="850" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="568" y="245" font-size="23" font-weight="600" fill="#176855" text-anchor="start">Verified</text><text x="775" y="245" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Keep valid evidence; avoid rework</text><rect x="550" y="281" width="850" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="568" y="321" font-size="23" font-weight="600" fill="#176855" text-anchor="start">Awaiting checks</text><text x="775" y="321" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Verify before declaring completion</text><rect x="550" y="357" width="850" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="568" y="397" font-size="23" font-weight="600" fill="#176855" text-anchor="start">Not started</text><text x="775" y="397" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Choose work whose inputs are ready</text><rect x="550" y="433" width="850" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="568" y="473" font-size="23" font-weight="600" fill="#176855" text-anchor="start">Blocked</text><text x="775" y="473" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Record needs; advance other work</text><rect x="550" y="605" width="850" height="78" rx="12" fill="#E8F3ED" stroke="#C9DDD2"/><text x="574" y="638" font-size="24" font-weight="600" fill="#176855" text-anchor="start">Status query → answer and continue</text><text x="574" y="666" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Goal change or pause → follow the latest instruction.</text></g></svg>