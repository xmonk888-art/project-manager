<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img"><title>项目管家：目标驱动工作流</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="758" height="828" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="105" font-size="40" font-weight="700" fill="#18392F" text-anchor="start">先看进度，再推进最终目标</text><text x="40" y="150" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">确认范围后持续执行，检查失败就修复复验。</text><rect x="40" y="230" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="265" font-size="23" font-weight="700" fill="#176855" text-anchor="start">01</text><text x="60" y="306" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">判断进度</text><text x="60" y="344" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">核对对话、记录和成果</text><rect x="390" y="230" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="265" font-size="23" font-weight="700" fill="#176855" text-anchor="start">02</text><text x="410" y="306" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">确认目标</text><text x="410" y="344" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">明确交付与通过条件</text><rect x="40" y="390" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="425" font-size="23" font-weight="700" fill="#176855" text-anchor="start">03</text><text x="60" y="466" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">衔接阶段</text><text x="60" y="504" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">当前任务服务最终目标</text><rect x="390" y="390" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="425" font-size="23" font-weight="700" fill="#176855" text-anchor="start">04</text><text x="410" y="466" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">执行检查</text><text x="410" y="504" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">按需分工并检查成果</text><rect x="40" y="550" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="585" font-size="23" font-weight="700" fill="#176855" text-anchor="start">05</text><text x="60" y="626" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">修复复验</text><text x="60" y="664" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">必要项未通过就返工</text><rect x="390" y="550" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="585" font-size="23" font-weight="700" fill="#176855" text-anchor="start">06</text><text x="410" y="626" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">验收交付</text><text x="410" y="664" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">全部必要项通过再交付</text><rect x="40" y="730" width="680" height="64" rx="12" fill="#E8F3ED" stroke="#C9DDD2"/><text x="60" y="770" font-size="25" font-weight="600" fill="#176855" text-anchor="start">失败 → 修复 → 复验；真实阻塞则保留进度</text></g></svg>