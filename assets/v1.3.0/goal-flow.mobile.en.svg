<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img"><title>Project manager: goal-led workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="758" height="828" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="102" font-size="42" font-weight="700" fill="#18392F" text-anchor="start">One agreed goal.</text><text x="40" y="153" font-size="38" font-weight="700" fill="#18392F" text-anchor="start">Work through to delivery.</text><text x="40" y="195" font-size="25" font-weight="400" fill="#526C65" text-anchor="start">Confirm scope. Execute. Repair. Verify.</text><rect x="40" y="230" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="265" font-size="23" font-weight="700" fill="#176855" text-anchor="start">01</text><text x="60" y="306" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Recover progress</text><text x="60" y="344" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Check records and outputs</text><rect x="390" y="230" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="265" font-size="23" font-weight="700" fill="#176855" text-anchor="start">02</text><text x="410" y="306" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Agree the goal</text><text x="410" y="344" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Set outputs and criteria</text><rect x="40" y="390" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="425" font-size="23" font-weight="700" fill="#176855" text-anchor="start">03</text><text x="60" y="466" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Connect stages</text><text x="60" y="504" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Link work to the goal</text><rect x="390" y="390" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="425" font-size="23" font-weight="700" fill="#176855" text-anchor="start">04</text><text x="410" y="466" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Execute and check</text><text x="410" y="504" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Coordinate and review</text><rect x="40" y="550" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="60" y="585" font-size="23" font-weight="700" fill="#176855" text-anchor="start">05</text><text x="60" y="626" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Repair and verify</text><text x="60" y="664" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">Fix failed requirements</text><rect x="390" y="550" width="330" height="140" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="410" y="585" font-size="23" font-weight="700" fill="#176855" text-anchor="start">06</text><text x="410" y="626" font-size="25" font-weight="650" fill="#18392F" text-anchor="start">Deliver the result</text><text x="410" y="664" font-size="22" font-weight="400" fill="#526C65" text-anchor="start">All required checks pass</text><rect x="40" y="730" width="680" height="64" rx="12" fill="#E8F3ED" stroke="#C9DDD2"/><text x="60" y="770" font-size="24" font-weight="600" fill="#176855" text-anchor="start">Fail → repair → verify. Blocked? Save recovery state.</text></g></svg>