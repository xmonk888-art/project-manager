<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1110" viewBox="0 0 760 1110" role="img"><title>目标、阶段与任务的关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#176855" stroke-width="1.5"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="758" height="1108" rx="24" fill="#F5F9F6" stroke="#C9DDD2"/><text x="40" y="47" font-size="20" font-weight="650" fill="#176855" text-anchor="start">PROJECT-MANAGER  /  v1.3.0</text><text x="40" y="105" font-size="40" font-weight="700" fill="#18392F" text-anchor="start">目标不丢，阶段不断</text><text x="40" y="150" font-size="24" font-weight="400" fill="#526C65" text-anchor="start">先核对真实进度，再选择下一项必要工作。</text><rect x="40" y="205" width="680" height="118" rx="14" fill="#176855" stroke="#176855"/><text x="64" y="248" font-size="30" font-weight="650" fill="#FFFFFF" text-anchor="start">最终目标</text><text x="64" y="282" font-size="23" font-weight="400" fill="#E5F2EB" text-anchor="start">交付物与验收标准</text><text x="64" y="311" font-size="22" font-weight="400" fill="#E5F2EB" text-anchor="start">目标版本 · 确认依据</text><path d="M380.0 326V342" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="345" width="680" height="118" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="64" y="388" font-size="30" font-weight="650" fill="#18392F" text-anchor="start">阶段目标</text><text x="64" y="429" font-size="25" font-weight="400" fill="#526C65" text-anchor="start">还缺哪些必要条件？</text><path d="M380.0 466V482" fill="none" stroke="#176855" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="485" width="680" height="118" rx="14" fill="#FFFFFF" stroke="#C9DDD2"/><text x="64" y="528" font-size="30" font-weight="650" fill="#18392F" text-anchor="start">当前任务</text><text x="64" y="569" font-size="25" font-weight="400" fill="#526C65" text-anchor="start">这一步支撑哪项验收？</text><text x="40" y="635" font-size="29" font-weight="650" fill="#18392F" text-anchor="start">进度要有依据</text><rect x="40" y="650" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="58" y="690" font-size="25" font-weight="600" fill="#176855" text-anchor="start">已验证完成</text><text x="235" y="690" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">保留有效证据，不重复做</text><rect x="40" y="726" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="58" y="766" font-size="25" font-weight="600" fill="#176855" text-anchor="start">待验收</text><text x="235" y="766" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">继续检查，不提前交付</text><rect x="40" y="802" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="58" y="842" font-size="25" font-weight="600" fill="#176855" text-anchor="start">未开始</text><text x="235" y="842" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">按依赖选择下一项工作</text><rect x="40" y="878" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#C9DDD2"/><text x="58" y="918" font-size="25" font-weight="600" fill="#176855" text-anchor="start">真实阻塞</text><text x="235" y="918" font-size="23" font-weight="400" fill="#526C65" text-anchor="start">记录条件，推进独立任务</text><rect x="40" y="1035" width="680" height="53" rx="12" fill="#E8F3ED" stroke="#C9DDD2"/><text x="58" y="1069" font-size="24" font-weight="600" fill="#176855" text-anchor="start">问进度后继续；改目标或暂停则遵从新指令</text></g></svg>