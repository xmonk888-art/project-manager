<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img"><title>Project manager</title><rect x="1" y="1" width="678" height="548" rx="20" fill="#EAF4F1" stroke="#D0E0E1"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="26" y="39" font-size="23" fill="#155D54" font-weight="700">XUALAB · FIRST SKILL</text><text x="26" y="87" font-size="40" fill="#172C3C" font-weight="700">Project manager</text><rect x="24" y="108" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="142" font-size="25" fill="#155D54" font-weight="650">01</text><text x="91" y="142" font-size="30" fill="#172C3C" font-weight="700">Intake</text><text x="91" y="173" font-size="25" fill="#496276" font-weight="500">Confirm the goal, inputs and scope</text><rect x="24" y="206" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="240" font-size="25" fill="#155D54" font-weight="650">02</text><text x="91" y="240" font-size="30" fill="#172C3C" font-weight="700">Recover context</text><text x="91" y="271" font-size="25" fill="#496276" font-weight="500">Check versions and project state</text><rect x="24" y="304" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="338" font-size="25" fill="#155D54" font-weight="650">03</text><text x="91" y="338" font-size="30" fill="#172C3C" font-weight="700">Assign work</text><text x="91" y="369" font-size="25" fill="#496276" font-weight="500">Use available skills as needed</text><rect x="24" y="402" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="436" font-size="25" fill="#155D54" font-weight="650">04</text><text x="91" y="436" font-size="30" fill="#172C3C" font-weight="700">Review and hand off</text><text x="91" y="467" font-size="25" fill="#496276" font-weight="500">Check outputs, evidence and next steps</text><text x="27" y="529" font-size="25" fill="#155D54" font-weight="600">Fill evidence gaps and recheck.</text></g></svg>