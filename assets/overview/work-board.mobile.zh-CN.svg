<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img"><title>项目管家</title><rect x="1" y="1" width="678" height="450" rx="20" fill="#EAF0F8" stroke="#D0E0E1"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="26" y="39" font-size="23" fill="#28547F" font-weight="700">项目任务看板</text><text x="26" y="87" font-size="40" fill="#172C3C" font-weight="700">项目管家</text><rect x="24" y="108" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="142" font-size="25" fill="#28547F" font-weight="650">01</text><text x="91" y="142" font-size="30" fill="#172C3C" font-weight="700">恢复项目</text><text x="91" y="173" font-size="25" fill="#496276" font-weight="500">确认目标、授权与当前版本</text><rect x="24" y="206" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="240" font-size="25" fill="#28547F" font-weight="650">02</text><text x="91" y="240" font-size="30" fill="#172C3C" font-weight="700">提交计划</text><text x="91" y="271" font-size="25" fill="#496276" font-weight="500">列明分工、交付与验收，等用户确认</text><rect x="24" y="304" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="338" font-size="25" fill="#28547F" font-weight="650">03</text><text x="91" y="338" font-size="30" fill="#172C3C" font-weight="700">执行与验收</text><text x="91" y="369" font-size="25" fill="#496276" font-weight="500">按获批计划执行，核对成果和证据</text><text x="27" y="431" font-size="25" fill="#28547F" font-weight="600">工作流示意</text></g></svg>