<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img"><title>一轮工作如何推进</title><rect x="1" y="1" width="678" height="450" rx="20" fill="#EAF0F8" stroke="#D0E0E1"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="26" y="39" font-size="23" fill="#28547F" font-weight="700">项目任务看板</text><text x="26" y="87" font-size="40" fill="#172C3C" font-weight="700">一轮工作如何推进</text><rect x="24" y="108" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="142" font-size="25" fill="#28547F" font-weight="650">01</text><text x="91" y="142" font-size="30" fill="#172C3C" font-weight="700">恢复项目</text><text x="91" y="173" font-size="25" fill="#496276" font-weight="500">确认目标、授权与当前版本</text><rect x="24" y="206" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="240" font-size="25" fill="#28547F" font-weight="650">02</text><text x="91" y="240" font-size="30" fill="#172C3C" font-weight="700">分工执行</text><text x="91" y="271" font-size="25" fill="#496276" font-weight="500">明确职责与交付物，调用专业技能</text><rect x="24" y="304" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="338" font-size="25" fill="#28547F" font-weight="650">03</text><text x="91" y="338" font-size="30" fill="#172C3C" font-weight="700">检查交接</text><text x="91" y="369" font-size="25" fill="#496276" font-weight="500">核对证据，记录未决问题和下一步</text><text x="27" y="431" font-size="25" fill="#28547F" font-weight="600">工作流示意</text></g></svg>