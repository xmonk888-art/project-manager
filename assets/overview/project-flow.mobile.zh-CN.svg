<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img"><title>项目管家</title><rect x="1" y="1" width="678" height="548" rx="20" fill="#EAF4F1" stroke="#D0E0E1"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="26" y="39" font-size="23" fill="#155D54" font-weight="700">xualab · 首个技能</text><text x="26" y="87" font-size="40" fill="#172C3C" font-weight="700">项目管家</text><rect x="24" y="108" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="142" font-size="25" fill="#155D54" font-weight="650">01</text><text x="91" y="142" font-size="30" fill="#172C3C" font-weight="700">接收项目</text><text x="91" y="173" font-size="25" fill="#496276" font-weight="500">确认目标、资料和授权</text><rect x="24" y="206" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="240" font-size="25" fill="#155D54" font-weight="650">02</text><text x="91" y="240" font-size="30" fill="#172C3C" font-weight="700">恢复项目</text><text x="91" y="271" font-size="25" fill="#496276" font-weight="500">核对当前版本与状态</text><rect x="24" y="304" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="338" font-size="25" fill="#155D54" font-weight="650">03</text><text x="91" y="338" font-size="30" fill="#172C3C" font-weight="700">分工执行</text><text x="91" y="369" font-size="25" fill="#496276" font-weight="500">按需调用已有专业技能</text><rect x="24" y="402" width="632" height="85" rx="12" fill="#fff" stroke="#D0E0E1"/><text x="44" y="436" font-size="25" fill="#155D54" font-weight="650">04</text><text x="91" y="436" font-size="30" fill="#172C3C" font-weight="700">验收交付</text><text x="91" y="467" font-size="25" fill="#496276" font-weight="500">检查成果和证据，记录下一步</text><text x="27" y="529" font-size="25" fill="#155D54" font-weight="600">证据缺项时退回补证，并再次回查。</text></g></svg>